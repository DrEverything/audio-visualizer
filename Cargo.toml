[package]
name = "uni-ass"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.35.0", features = ["wgpu"] }
bytemuck = { version = "1.25.0", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
pollster = "0.4"


[profile.dev]
opt-level = 0
debug = 1

[profile.dev.package."*"]
opt-level = 3
